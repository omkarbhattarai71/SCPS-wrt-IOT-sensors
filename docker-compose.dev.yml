services:
  db:
    image: postgis/postgis:17-3.5
    container_name: smart-city-parking-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    networks:
      - smart-city-parking

  backend:
    build: ./backend
    container_name: smart-city-parking-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/api:/app/api
      - ./backend/smart_city_parking:/app/smart_city_parking
      - ./backend/manage.py:/app/manage.py
      - ./backend/requirements.txt:/app/requirements.txt
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      - FIREBASE_API_KEY=${REACT_APP_FIREBASE_API_KEY}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - ALLOWED_HOSTS=${API_HOST}
      - CORS_ALLOWED_ORIGINS=${API_URL}
      - FORECAST_SERVICE_URL=http://predict:8000
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    restart: unless-stopped
    networks:
      - smart-city-parking

  predict:
    build:
      context: ./backend
      dockerfile: prediction_service/Dockerfile
    container_name: smart-city-parking-predict
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG}
      - ALLOWED_HOSTS=*
    networks:
      - smart-city-parking
    restart: unless-stopped

  frontend:
    build:
      context: ./smartparking
      dockerfile: Dockerfile.dev
    container_name: smart-city-parking-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./smartparking/src:/app/src
      - ./smartparking/public:/app/public
      - ./smartparking/package.json:/app/package.json
      - /app/node_modules
    environment:
      - REACT_APP_API_URL=${API_URL}
      - REACT_APP_FIREBASE_API_KEY=${REACT_APP_FIREBASE_API_KEY}
      - REACT_APP_FIREBASE_AUTH_DOMAIN=${REACT_APP_FIREBASE_AUTH_DOMAIN}
      - REACT_APP_FIREBASE_PROJECT_ID=${REACT_APP_FIREBASE_PROJECT_ID}
      - REACT_APP_FIREBASE_STORAGE_BUCKET=${REACT_APP_FIREBASE_STORAGE_BUCKET}
      - REACT_APP_FIREBASE_MESSAGING_SENDER_ID=${REACT_APP_FIREBASE_MESSAGING_SENDER_ID}
      - REACT_APP_FIREBASE_APP_ID=${REACT_APP_FIREBASE_APP_ID}
      - REACT_APP_FIREBASE_MEASUREMENT_ID=${REACT_APP_FIREBASE_MEASUREMENT_ID}
      - WATCHPACK_POLLING=true
    depends_on:
      backend:
        condition: service_healthy
        restart: true
    stdin_open: true
    tty: true
    networks:
      - smart-city-parking

volumes:
  postgres_data:

networks:
  smart-city-parking:
    driver: bridge